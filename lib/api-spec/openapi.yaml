openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Coffee in the Room API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product operations
  - name: clients
    description: Client operations
  - name: sales
    description: Sales operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /products/{id}/sell:
    post:
      operationId: quickSellProduct
      tags: [products]
      summary: Quick sell (decrement stock)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{id}:
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /clients/{id}/purchase:
    post:
      operationId: registerPurchase
      tags: [clients]
      summary: Register a purchase for a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmountBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{id}/payment:
    post:
      operationId: registerPayment
      tags: [clients]
      summary: Register a payment from a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmountBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /sales:
    get:
      operationId: listSales
      tags: [sales]
      summary: List all sales
      responses:
        "200":
          description: List of sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
    post:
      operationId: createSale
      tags: [sales]
      summary: Register a sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSaleBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: number
        stock:
          type: integer
      required:
        - id
        - name
        - price
        - stock

    CreateProductBody:
      type: object
      properties:
        name:
          type: string
        price:
          type: number
        stock:
          type: integer
      required:
        - name
        - price
        - stock

    Client:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        cpf:
          type: string
        phone:
          type: string
        birthday:
          type: string
          nullable: true
        code:
          type: integer
        totalPurchases:
          type: number
        totalPaid:
          type: number
        balance:
          type: number
      required:
        - id
        - name
        - cpf
        - phone
        - code
        - totalPurchases
        - totalPaid
        - balance

    CreateClientBody:
      type: object
      properties:
        name:
          type: string
        cpf:
          type: string
        phone:
          type: string
        birthday:
          type: string
          nullable: true
      required:
        - name
        - cpf
        - phone

    AmountBody:
      type: object
      properties:
        amount:
          type: number
      required:
        - amount

    Sale:
      type: object
      properties:
        id:
          type: integer
        clientName:
          type: string
        productName:
          type: string
        paymentMethod:
          type: string
        quantity:
          type: integer
        date:
          type: string
      required:
        - id
        - clientName
        - productName
        - paymentMethod
        - quantity
        - date

    CreateSaleBody:
      type: object
      properties:
        clientName:
          type: string
        productName:
          type: string
        paymentMethod:
          type: string
        quantity:
          type: integer
      required:
        - clientName
        - productName
        - paymentMethod
        - quantity
